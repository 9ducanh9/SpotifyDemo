name: local_music_player
description: A Flutter application for local music playback with offline support.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Local Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  
  # Audio Playback & Recording
  audioplayers: ^6.0.0
  record: ^5.1.2
  permission_handler: ^11.3.0
  
  # UI & Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
