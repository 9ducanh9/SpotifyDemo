name: music_player
description: Trình phát nhạc cục bộ với đầy đủ tính năng
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^17.0.1
  provider: ^6.1.1

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Audio Player & Recording
  audioplayers: ^6.5.1
  record: ^6.1.2
  permission_handler: ^12.0.1
  path: ^1.9.0

  # Network & API
  http: ^1.1.0
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^3.1.0
  state_notifier: ^1.0.0

  # Charts & Statistics
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.1.21

  # PDF & CSV Export
  pdf: ^3.10.7
  csv: ^6.0.0
  file_picker: ^10.3.8
  share_plus: ^12.0.1

  # Authentication
  google_sign_in: ^7.2.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/







