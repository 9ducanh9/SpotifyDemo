name: local_music_player
description: A Flutter application for local music playback with offline support.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Local Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  
  # Audio Playback & Recording
  audioplayers: ^6.0.0
  record: ^5.1.2
  permission_handler: ^11.3.0
  
  # UI & Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  
  # Firebase (Auth + Firestore)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1
  
  # Charts
  fl_chart: ^0.69.0
  
  # Export (CSV & PDF)
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.2
  
  # Connectivity & Sync
  connectivity_plus: ^6.1.0
  
  # File picker (for better file selection)
  file_picker: ^8.1.2
  
  # Share files
  share_plus: ^10.1.2
  
  # Real-time & Notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  
  # Performance optimization
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
